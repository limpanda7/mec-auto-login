name: MEC 자동 로그인

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 (KST = UTC+9 → UTC 00:00)
  workflow_dispatch:       # GitHub에서 수동 실행 버튼도 생김

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: 로그인 실행
        env:
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          HTL_USERNAME: ${{ secrets.HTL_USERNAME }}
          HTL_PASSWORD: ${{ secrets.HTL_PASSWORD }}
        run: node login.js

      - name: 실패 스크린샷 업로드 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-fail-screenshots
          path: login_fail_*.png
          retention-days: 90
